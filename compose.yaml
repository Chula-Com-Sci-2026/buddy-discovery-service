services:
  grpc:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/buddy_discovery_service_development
      TEST_DATABASE_URL: postgres://postgres:postgres@db:5432/buddy_discovery_service_test
    ports:
      - "50051:50051"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/rails

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - buddy_discovery_postgres:/var/lib/postgresql/data

volumes:
  buddy_discovery_postgres:
